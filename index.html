<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мини-кликер — HTMLBubbles test</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #171717; color: #f5f0e6;
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    width: min(100% - 24px, 360px); padding: 24px;
    border: 1px solid #66502a; border-radius: 22px;
    background: linear-gradient(145deg,#28251f,#191919);
    text-align: center; box-shadow: 0 18px 50px #0008;
  }
  .eyebrow { color: #c6a15b; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
  h1 { margin: 8px 0 4px; font-size: 25px; }
  .sub { margin: 0 0 22px; color: #aaa39a; font-size: 13px; }
  .score { font-size: 64px; font-weight: 750; line-height: 1.15; margin: 12px 0 18px; font-variant-numeric: tabular-nums; }
  button {
    border: 0; border-radius: 14px; padding: 14px 18px;
    font: inherit; font-weight: 700; cursor: pointer;
  }
  #plus { width: 100%; color: #211a0d; background: #d7b46b; font-size: 18px; }
  #plus:active { transform: scale(.98); background: #edcf8b; }
  .bottom { display: flex; gap: 10px; margin-top: 10px; }
  .bottom button { flex: 1; color: #e8dfcf; background: #39352e; }
  .hint { color: #8f897f; font-size: 12px; margin: 18px 0 0; }
  .pop { animation: pop .16s ease-out; }
  @keyframes pop { 50% { transform: scale(1.13); } }
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">HTMLBubbles · тест</div>
    <h1>Золотой кликер</h1>
    <p class="sub">Проверяем HTML, CSS и JavaScript</p>
    <div id="score" class="score" aria-live="polite">0</div>
    <button id="plus" type="button">＋ Нажми меня</button>
    <div class="bottom">
      <button id="minus" type="button">−1</button>
      <button id="reset" type="button">Сбросить</button>
    </div>
    <p class="hint">Каждое нажатие меняет счётчик</p>
  </main>
<script>
(() => {
  let count = 0;
  const score = document.getElementById('score');
  function render() {
    score.textContent = String(count);
    score.classList.remove('pop');
    void score.offsetWidth;
    score.classList.add('pop');
  }
  document.getElementById('plus').addEventListener('click', () => {
    count++;
    render();
  });
  document.getElementById('minus').addEventListener('click', () => {
    count--;
    render();
  });
  document.getElementById('reset').addEventListener('click', () => {
    count = 0;
    render();
  });
})();
</script>
</body>
</html>
